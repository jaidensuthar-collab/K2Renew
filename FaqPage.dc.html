<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>K2 Renew, landowner question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.fq{--bg:#F6F5EC;--ink:#111B15;--ink2:#38443D;--rule:#BDB8A3;--green:#1E4B30;--btn:#1E4B30;--btn-ink:#FFFFFF;--deep:#1E4B30;--deep-ink:#F6F5EC;--focus:#111B15;
background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:18px;line-height:1.65;min-height:100%}
@media (prefers-color-scheme: dark){.fq{--bg:#0F1611;--ink:#EDF0E4;--ink2:#B9C4B5;--rule:#3A4A40;--green:#A6D8AE;--btn:#A6D8AE;--btn-ink:#0C1A10;--deep:#14301F;--focus:#F0C94F}}
.fq *{box-sizing:border-box}
.fq h1{font-family:'Zilla Slab',Georgia,serif;font-weight:700;font-size:clamp(32px,8vw,52px);line-height:1.12;margin:0 0 24px;max-width:18em}
.fq p{margin:0}
.fq a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.fq .wrap{max-width:820px;margin:0 auto;padding:0 20px}
.fq .bar{border-bottom:1px solid var(--rule)}
.fq .bar .wrap{display:flex;align-items:center;justify-content:space-between;min-height:72px}
.fq .mark{font-family:'Zilla Slab',Georgia,serif;font-weight:700;font-size:28px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;min-height:54px}
.fq .tel{display:none;font-weight:700;font-size:20px;color:var(--ink);text-decoration:none;align-items:center;min-height:54px}
.fq .back{display:inline-flex;align-items:center;min-height:54px;color:var(--green);font-weight:700}
.fq .ans{font-size:clamp(22px,4.5vw,28px);line-height:1.5;max-width:28em;padding:24px 0;border-top:4px solid var(--ink);margin-bottom:36px}
.fq .btn{display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 24px;background:var(--btn);color:var(--btn-ink);font:700 19px/1.2 'Atkinson Hyperlegible',system-ui,sans-serif;border-radius:4px;text-decoration:none}
.fq .alt{margin-top:20px;color:var(--ink2)}
.fq .alt a{color:var(--ink);font-weight:700;display:inline-flex;align-items:center;min-height:54px}
.fq .main{padding:24px 0 120px}
.fq .callbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;min-height:64px;background:var(--deep);color:var(--deep-ink);font:700 22px/1.2 'Atkinson Hyperlegible',system-ui,sans-serif;text-decoration:none}
@media (min-width:760px){.fq .wrap{padding:0 40px}.fq .tel{display:inline-flex}.fq .btn{display:inline-flex}.fq .callbar{display:none}.fq .main{padding:40px 0 96px}}
</style>
</helmet>
<div class="fq">
 <div class="bar"><div class="wrap">
  <a class="mark" href="Main.dc.html">K2 Renew</a>
  <a class="tel" href="tel:+17204458020">(720) 445-8020</a>
 </div></div>
 <div class="wrap main">
  <a class="back" href="Main.dc.html">&larr; All questions</a>
  <h1>{{question}}</h1>
  <p class="ans">{{answer}}</p>
  <a class="btn" href="Main.dc.html">See if my land qualifies</a>
  <p class="alt">Prefer to talk? <a href="tel:+17204458020">(720) 445-8020</a></p>
 </div>
 <a class="callbar" href="tel:+17204458020">Call (720) 445-8020</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"question":{"editor":null,"default":"Do I still own my land if I sign a lease?"},"answer":{"editor":null,"default":"Yes. A lease is not a sale. You retain full ownership of your land."},"$preview":{"width":820,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {
question: this.props.question ?? 'Do I still own my land if I sign a lease?',
answer: this.props.answer ?? 'Yes. A lease is not a sale. You retain full ownership of your land.'
};
}
}
</script>
</body>
</html>
